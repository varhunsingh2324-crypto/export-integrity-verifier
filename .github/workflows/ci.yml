name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PG_DSN: postgresql://eguard:eguard@localhost:5432/eguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Same compose stack as local dev (initdb creates the scratch schema); the simulation runs
      # pg_dump/psql via `docker compose exec`, which a GitHub service container cannot provide.
      - run: make up
      - run: make lint
      - run: make test
